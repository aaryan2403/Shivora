[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# Force all domains (custom + netlify.app) to use the same production build
[context.production]
  command = "npm run build"

[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"

# Force all traffic to HTTPS
[[redirects]]
  from = "http://*"
  to = "https://:splat"
  status = 301
  force = true

# Redirect www to non-www (canonical domain)
[[redirects]]
  from = "https://www.myshivora.com/*"
  to = "https://myshivora.com/:splat"
  status = 301
  force = true

# Prevent stale HTML caching on all domains
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Next.js static assets can be cached long-term
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SSL Note: myshivora.com must be added as a custom domain in Netlify
# dashboard and have an active SSL certificate provisioned.
# If you see NET::ERR_CERT_COMMON_NAME_INVALID, the domain is not
# registered in Netlify → Site settings → Domain management.
